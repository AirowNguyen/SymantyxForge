<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Copilot Log Viewer</title>
<style>
body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
#log { white-space: pre-wrap; }
</style>
</head>
<body>
<h2>Copilot Live Log</h2>
<div id="log">Loading…</div>

<script>
async function updateLog() {
    const res = await fetch("copilot.log?ts=" + Date.now());
    const text = await res.text();
    document.getElementById("log").textContent = text;
}

setInterval(updateLog, 500); // update twice per second
updateLog();
</script>
</body>
</html>
