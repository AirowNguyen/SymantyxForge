<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Symantyx Canvas</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            background: #181818;
        }

        #searchPopup {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #222;
            padding: 12px;
            border-radius: 8px;
            display: none;
            color: #fff;
        }

        #detailPane {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px;
            display: none;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div id="searchPopup"></div>
    <div id="detailPane"></div>

    <script src="CanvasRenderer.js"></script>
    <script src="TabRsSearchPopup.js"></script>
    <script src="HypertupleDetailPane.js"></script>
    <script src="StylusInput.js"></script>
</body>
</html>
